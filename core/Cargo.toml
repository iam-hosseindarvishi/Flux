[package]
name = "flux-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.7.2"
tokio-test = "0.4"
